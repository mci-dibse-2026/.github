<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DIBSE 2026 – Digital Business &amp; Software Engineering, MCI Innsbruck">
  <defs>
